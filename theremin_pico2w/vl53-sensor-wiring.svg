<text x="185" y="491" font-size="18" fill="#dcefe7" font-weight="600" text-anchor="middle">VL53L1X</text>
<text x="185" y="521" font-size="18" fill="#dcefe7" font-weight="600" text-anchor="middle">/ VL53L4CD</text>
<text x="185" y="793" font-size="18" fill="#b1d3c7" font-weight="600" text-anchor="middle">MODULE</text>
<text x="415" y="354" font-size="26" fill="#ffffff" font-weight="600" text-anchor="end">VIN</text>
<circle cx="450" cy="345" r="10" fill="#c8b17c"/><circle cx="450" cy="345" r="5" fill="#233d37"/>
<rect x="615" y="313" width="405" height="66" fill="#ffffff" rx="12" stroke="none" stroke-width="2"/>
<rect x="1050" y="313" width="420" height="66" fill="#ffffff" rx="12" stroke="none" stroke-width="2"/>
