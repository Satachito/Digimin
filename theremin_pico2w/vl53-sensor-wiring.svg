<text x="415" y="854" font-size="26" fill="#ffffff" font-weight="600" text-anchor="end">XSHUT</text>
<circle cx="450" cy="845" r="10" fill="#c8b17c"/><circle cx="450" cy="845" r="5" fill="#233d37"/>
<rect x="615" y="813" width="405" height="66" fill="#ffffff" rx="12" stroke="none" stroke-width="2"/>
<rect x="1050" y="813" width="420" height="66" fill="#ffffff" rx="12" stroke="none" stroke-width="2"/>
<line x1="463" y1="845" x2="585" y2="845" stroke="#718096" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/>
<rect x="637" y="835" width="5" height="20" fill="#2563eb" rx="2" stroke="none" stroke-width="2"/>
<rect x="1072" y="835" width="5" height="20" fill="#ad44b9" rx="2" stroke="none" stroke-width="2"/>
<text x="835" y="854" font-size="28" fill="#2563eb" font-weight="600" text-anchor="middle">GP9（12）</text>
<text x="1255" y="854" font-size="28" fill="#ad44b9" font-weight="600" text-anchor="middle">GP22（29）</text>
<rect x="70" y="940" width="1400" height="98" fill="#e7edf4" rx="12" stroke="none" stroke-width="2"/>
<text x="98" y="978" font-size="21" fill="#475569" font-weight="400" text-anchor="start">（ ）内：Pico の物理ピン番号  /  各モジュールの GND は Pico の GND と共通に接続</text>
<text x="98" y="1013" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">端子の並びは模式図です。実物のモジュールに印刷された端子名に合わせて接続してください。</text>
</g></svg>