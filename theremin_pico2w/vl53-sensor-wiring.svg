<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1080" viewBox="0 0 1540 1080"><title>VL53L1X / VL53L4CD モジュール 配線図</title><desc>Raspberry Pi Pico 2 W への接続。音程用と音量用の接続先を左右に表示。</desc><g font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">
