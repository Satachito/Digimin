<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020"><title>GP16 PWM 音声出力 RCフィルタ回路図</title><desc>GP16物理21番からR1 1kΩ、R2 1kΩ、C3 10µFを直列接続。R1後にC1 10nF、R2後にC2 10nF、C3後にR3 3.3kΩを接地。C3の正極はGP16側。出力はジャックTipとRingに共通接続、SleeveはGND。</desc><g font-family="Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif">
<rect x="0" y="0" width="1600" height="1020" fill="#f4f7fb" rx="0" stroke="none" stroke-width="2"/>
<text x="70" y="79" font-size="40" fill="#243247" font-weight="700" text-anchor="start">PWM 音声出力 / RC フィルタ</text>
<text x="72" y="122" font-size="23" fill="#64748b" font-weight="400" text-anchor="start">Raspberry Pi Pico 2 W  ·  GP16（物理ピン 21）→ オーディオジャック</text>
<rect x="70" y="182" width="1460" height="62" fill="#e7edf4" rx="12" stroke="none" stroke-width="2"/>
<text x="100" y="222" font-size="22" fill="#008879" font-weight="600" text-anchor="start">2 段 RC フィルタ</text>
<text x="880" y="222" font-size="22" fill="#c27c09" font-weight="600" text-anchor="start">AC カップリング</text>
<text x="1280" y="222" font-size="22" fill="#475569" font-weight="600" text-anchor="start">ジャック接続</text>
<rect x="70" y="279" width="1460" height="567" fill="#ffffff" rx="20" stroke="none" stroke-width="2"/>
<rect x="94" y="368" width="137" height="88" fill="#e4f3ef" rx="12" stroke="none" stroke-width="2"/>
<text x="162" y="405" font-size="28" fill="#008879" font-weight="700" text-anchor="middle">GP16</text>
<text x="162" y="436" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">（21）</text>
<line x1="231" y1="410" x2="290" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<rect x="290" y="394" width="110" height="32" fill="#fff" rx="3" stroke="#008879" stroke-width="4"/>
<line x1="400" y1="410" x2="490" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<circle cx="490" cy="410" r="6" fill="#008879"/>
<text x="345" y="342" font-size="24" fill="#008879" font-weight="600" text-anchor="middle">R1</text>
<text x="345" y="375" font-size="24" fill="#243247" font-weight="400" text-anchor="middle">1 kΩ</text>
<line x1="490" y1="410" x2="610" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<rect x="610" y="394" width="110" height="32" fill="#fff" rx="3" stroke="#008879" stroke-width="4"/>
<line x1="720" y1="410" x2="810" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<circle cx="810" cy="410" r="6" fill="#008879"/>
<text x="665" y="342" font-size="24" fill="#008879" font-weight="600" text-anchor="middle">R2</text>
<text x="665" y="375" font-size="24" fill="#243247" font-weight="400" text-anchor="middle">1 kΩ</text>
<line x1="490" y1="410" x2="490" y2="555" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="463" y1="555" x2="517" y2="555" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="463" y1="573" x2="517" y2="573" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="490" y1="573" x2="490" y2="760" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<text x="538" y="559" font-size="24" fill="#008879" font-weight="600" text-anchor="start">C1</text>
<text x="538" y="595" font-size="23" fill="#243247" font-weight="400" text-anchor="start">10 nF</text>
<line x1="810" y1="410" x2="810" y2="555" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="783" y1="555" x2="837" y2="555" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="783" y1="573" x2="837" y2="573" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="810" y1="573" x2="810" y2="760" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<text x="858" y="559" font-size="24" fill="#008879" font-weight="600" text-anchor="start">C2</text>
<text x="858" y="595" font-size="23" fill="#243247" font-weight="400" text-anchor="start">10 nF</text>
<line x1="810" y1="410" x2="965" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="965" y1="381" x2="965" y2="439" stroke="#c27c09" stroke-width="5" stroke-linecap="round"/>
<line x1="985" y1="381" x2="985" y2="439" stroke="#c27c09" stroke-width="5" stroke-linecap="round"/>
<line x1="985" y1="410" x2="1130" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<text x="975" y="315" font-size="24" fill="#c27c09" font-weight="600" text-anchor="middle">C3</text>
<text x="975" y="350" font-size="25" fill="#243247" font-weight="400" text-anchor="middle">10 µF</text>
<text x="940" y="379" font-size="27" fill="#c27c09" font-weight="700" text-anchor="middle">+</text>
<text x="975" y="488" font-size="20" fill="#c27c09" font-weight="400" text-anchor="middle">＋：GP16 側</text>
<circle cx="1130" cy="410" r="6" fill="#008879"/>
<line x1="1130" y1="410" x2="1130" y2="555" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<rect x="1114" y="555" width="32" height="110" fill="#fff" rx="3" stroke="#008879" stroke-width="4"/>
<line x1="1130" y1="665" x2="1130" y2="760" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<text x="1170" y="591" font-size="24" fill="#008879" font-weight="600" text-anchor="start">R3</text>
<text x="1170" y="627" font-size="23" fill="#243247" font-weight="400" text-anchor="start">3.3 kΩ</text>
<line x1="1130" y1="410" x2="1305" y2="410" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<circle cx="1305" cy="410" r="6" fill="#008879"/>
<line x1="1305" y1="370" x2="1305" y2="450" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
<line x1="1305" y1="370" x2="1410" y2="370" stroke="#008879" stroke-width="4" stroke-linecap="round"/>
