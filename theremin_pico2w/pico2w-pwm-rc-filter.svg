<circle cx="1410" cy="370" r="7" fill="#fff" stroke="#008879" stroke-width="4"/>
<text x="1430" y="379" font-size="26" fill="#008879" font-weight="600" text-anchor="start">Tip</text>
<circle cx="1410" cy="450" r="7" fill="#fff" stroke="#008879" stroke-width="4"/>
<text x="1430" y="459" font-size="26" fill="#008879" font-weight="600" text-anchor="start">Ring</text>
<text x="1390" y="512" font-size="20" fill="#64748b" font-weight="400" text-anchor="middle">両方に接続</text>
<line x1="490" y1="760" x2="1410" y2="760" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<circle cx="490" cy="760" r="6" fill="#64748b"/>
<circle cx="810" cy="760" r="6" fill="#64748b"/>
<circle cx="1130" cy="760" r="6" fill="#64748b"/>
<line x1="810" y1="760" x2="810" y2="778" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<line x1="790" y1="778" x2="830" y2="778" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<line x1="797" y1="788" x2="823" y2="788" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<line x1="804" y1="798" x2="816" y2="798" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
<text x="810" y="829" font-size="20" fill="#64748b" font-weight="600" text-anchor="middle">GND</text>
<circle cx="1410" cy="760" r="7" fill="#fff" stroke="#64748b" stroke-width="4"/>
<text x="1430" y="769" font-size="24" fill="#64748b" font-weight="600" text-anchor="start">Sleeve</text>
<rect x="70" y="884" width="1460" height="88" fill="#e7edf4" rx="12" stroke="none" stroke-width="2"/>
<text x="99" y="921" font-size="22" fill="#475569" font-weight="400" text-anchor="start">Tip と Ring は同じ音声信号に接続。Sleeve は Pico の GND と共通にします。</text>
<text x="99" y="955" font-size="21" fill="#64748b" font-weight="400" text-anchor="start">C3：有極性コンデンサーの ＋ 側は GP16 側、− 側はジャック側。</text>
</g></svg>